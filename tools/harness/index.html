<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>dsh-katex-inline-copy · harness</title>
    <link rel="stylesheet" href="/node_modules/katex/dist/katex.min.css" />
    <style>
      :root {
        color-scheme: light;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft YaHei", sans-serif;
        font-size: 15px;
        line-height: 1.7;
      }
      body {
        margin: 0;
        padding: 28px 32px 64px;
        max-width: 900px;
        color: #1f2328;
      }
      h1 {
        font-size: 18px;
        margin: 0 0 4px;
      }
      .hint {
        color: #666;
        font-size: 13px;
        margin: 0 0 18px;
      }
      .hint code {
        background: #f2f3f5;
        padding: 1px 5px;
        border-radius: 4px;
      }
      .markdown p {
        margin: 12px 0;
        overflow-wrap: anywhere;
      }
      .markdown ul {
        padding-left: 24px;
      }
      .markdown pre {
        background: #f6f8fa;
        border: 1px solid #e5e7eb;
        border-radius: 8px;
        padding: 12px 14px;
        overflow: auto;
        font-size: 13px;
      }
      .markdown .katex-display {
        max-width: 100%;
        overflow-x: auto;
      }
      #log {
        margin-top: 28px;
        background: #0f172a;
        color: #e2e8f0;
        padding: 14px 16px;
        border-radius: 8px;
        font-size: 12px;
        white-space: pre-wrap;
        word-break: break-all;
        min-height: 40px;
      }
      #status {
        display: inline-block;
        font-size: 12px;
        color: #067647;
        background: #ecfdf3;
        border: 1px solid #abefc6;
        border-radius: 999px;
        padding: 2px 10px;
      }
    </style>
  </head>
  <body>
    <h1>dsh-katex-inline-copy · harness</h1>
    <p class="hint">
      与 DSH 相同的 KaTeX 渲染管线。选中正文任意位置按 <code>Ctrl+C</code>，
      下方会显示实际写入剪贴板的 <code>text/plain</code> 与 <code>text/html</code>。
      <span id="status">loading…</span>
    </p>

    <div id="root" class="markdown"></div>

    <pre id="log">（尚未复制）</pre>

    <script src="./harness.js"></script>
  </body>
</html>
